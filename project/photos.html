<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page info -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery | Elite Travel</title>


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,700;1,400&amp;family=Playfair+Display:wght@700&amp;display=swap">

  <!-- Shared styles for every page -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Styles only for this page -->
  <link rel="stylesheet" href="css/photos.css">
</head>
<body>
  <!-- HEADER (same on every page) -->
  <header class="header">
    <a class="logo" href="index.html">Elite Travel</a>
    <nav class="main-nav" aria-label="Main menu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="tips.html">Travel Tips</a></li>
        <li><a href="photos.html" aria-current="page">Photos</a></li>
        <li><a href="plan.html">Plan a Trip</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main id="main-content">

    <!-- Page title area -->
    <div class="page-intro">
      <h1>Photo Gallery</h1>
      <p>Get inspired before your trip. Each photo shows one of the featured destinations.</p>
    </div>

    <!-- Photo grid  -->
    <section aria-label="Travel photos">
      <h2>Photos</h2>
      <div class="photo-grid">
      <figure class="photo photo-wide">
        <img src="images/travel.jpg" alt="Flying over the sky with a sunset" width="1600" height="800" loading="lazy">
        <figcaption>Flying over the sky with a sunset.</figcaption>
      </figure>
      <figure class="photo">
        <img src="images/tokyo.jpg" alt="skyline during the evening" width="800" height="550" loading="lazy">
        <figcaption>Tokyo, Japan &ndash; skyline during the evening.</figcaption>
      </figure>
      <figure class="photo">
        <img src="images/london.jpg" alt="The Big Ben in London" width="800" height="550" loading="lazy">
        <figcaption>London, England &ndash; the Big Ben.</figcaption>
      </figure>
      <figure class="photo">
        <img src="images/losangeles.jpg" alt="A vibrant cityscape of the city" width="800" height="550" loading="lazy">
        <figcaption>Los Angeles, USA &ndash; a vibrant cityscape of the city.</figcaption>
      </figure>
      <figure class="photo">
        <img src="images/capetown.jpg" alt="beautiful skyline with the mountains in the background" width="800" height="550" loading="lazy">
        <figcaption>Cape Town, South Africa &ndash; a beautiful skyline with the mountains in the background.</figcaption>
      </figure>
      <figure class="photo">
        <img src="images/rio.jpg" alt="A view of the Christ the Redeemer statue and the skyline of Rio de Janeiro" width="800" height="550" loading="lazy">
        <figcaption>Rio de Janeiro, Brazil &ndash; a view of the Christ the Redeemer statue and the skyline.</figcaption>
      </figure>
      </div>
    </section>


    <p>
      Ready to go? <a href="plan.html">Plan your trip</a>.
    </p>

  </main>

  <!-- FOOTER (same on every page)-->
  <footer class="footer">
    <p>Elite Travel - By Bryan Chavez</p>
    <p>IT 301 - Static Web Site</p>
  </footer>
</body>
</html>
