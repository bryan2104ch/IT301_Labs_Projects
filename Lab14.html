<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises, fetch and APIs</title>
</head>
<body>
    <h1>Lab 14: API</h1>

    <script>
        let button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Generate Profile';

        let form = document.createElement('form');
        form.action = '#';
        form.appendChild(button);
        document.body.appendChild(form);

        let card = document.createElement('div');
        card.className = 'card';

        let img = document.createElement('img');
        let name = document.createElement('p');
        let email = document.createElement('p');
        let phone = document.createElement('p');

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(email);
        card.appendChild(phone);
        document.body.appendChild(card);

        const createImg = async () => {
            let p = await fetch('https://randomuser.me/api/');
            let data = await p.json();

            img.src = data.results[0].picture.large;
            name.textContent = data.results[0].name.first + ' ' + data.results[0].name.last;
            email.textContent = data.results[0].email;
            phone.textContent = data.results[0].phone;
        };

        button.addEventListener('click', createImg);
    </script>
</body>
</html>
