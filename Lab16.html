<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 16: Form Validation</title>
    <style>

    </style>
</head>

<body>
    <h1>Lab 16: Form Validation</h1>
    <form action="#">
        <label for="name">Name:</label>
        <input type="text" id="name">
        <label for="email">Email:</label>
        <input type="email" id="email">
        <label for="password">Password:</label>
        <input type="password" id="password">

        <div class="rules" id="password-rules">
            <div id="rule-length" class="rule">✖ At least 6 characters</div>
            <div id="rule-special" class="rule">✖ Must include a special character (!@#$...)</div>
            <div id="rule-uppercase" class="rule">✖ Must include an uppercase letter (A-Z)</div>
        </div>
        <button>Submit</button>
        <p id="result"></p>

        <script>
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const result = document.getElementById('result');
            const hide = document.getElementById('password-rules');
            hide.style.display = "none";
            password.addEventListener('input', () => {
                result.textContent = password.value;

                if (password.length >= 6){
                    result.textContent = "At least 6 characters";
                } 
            });

        </script>
    </form>
</body>

</html>
